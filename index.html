<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harta Mută</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  html { color-scheme: light; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  /* Layout: o foaie de hartă (grilă de paralele și meridiane) cu un singur rând de jocuri deasupra; accentul magenta vine din hărțile nautice. */
  :root {
    --sea: #E3EDF0;
    --paper: #F7FBFB;
    --ink: #0C2B3D;
    --ink-soft: #46606F;
    --rule: #CFDEE3;
    --rule-strong: #9DB6C0;
    --accent: #B3125B;
    --accent-ink: #FFFFFF;
    --good: #137A4B;
    --good-bg: #DDF2E7;
    --bad: #D32F2F;
    --bad-bg: #FDE3E3;
    --f-display: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --f-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea: #0A1B26;
      --paper: #11293A;
      --ink: #DCEAF0;
      --ink-soft: #8FA9B8;
      --rule: #14303F;
      --rule-strong: #2E5266;
      --accent: #F0589A;
      --accent-ink: #0A1B26;
      --good: #4CC98B;
      --good-bg: #12362A;
      --bad: #FF6B6B;
      --bad-bg: #40202A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sea: #0A1B26;
    --paper: #11293A;
    --ink: #DCEAF0;
    --ink-soft: #8FA9B8;
    --rule: #14303F;
    --rule-strong: #2E5266;
    --accent: #F0589A;
    --accent-ink: #0A1B26;
    --good: #4CC98B;
    --good-bg: #12362A;
    --bad: #FF6B6B;
    --bad-bg: #40202A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--sea);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: -1px -1px;
    color: var(--ink);
    font: 400 17px/1.5 var(--f-body);
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }
  .wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 28px; }
  h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.05; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Antet */
  .brand { display: flex; align-items: center; justify-content: center; text-align: center; gap: 16px; flex-wrap: wrap; }
  .brand svg { width: 64px; height: 64px; flex: none; color: var(--ink); }
  .brand h1 { font-size: clamp(2.5rem, 8vw, 4.2rem); font-weight: 700; letter-spacing: -0.02em; }
  .coords { font: 500 0.8rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
  .lead { max-width: 52ch; color: var(--ink-soft); font-size: 1.1rem; }
  .lead strong { color: var(--ink); font-weight: 600; }

  /* Selector de zonă */
  .zone { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .zone-label { font: 500 0.78rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--paper); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 0.45rem 1rem; cursor: pointer; font-weight: 600; }
  .seg label + input + label, .seg input + label + input + label { border-left: 1.5px solid var(--ink); }
  .seg input:checked + label { background: var(--ink); color: var(--sea); }
  .seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* Plăcile jocurilor */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .tile {
    display: grid; gap: 10px; align-content: start; text-align: left;
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 20px; cursor: pointer; min-width: 0;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .tile:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--accent); }
  .tile h2 { font-size: 1.6rem; font-weight: 700; }
  .tile p { color: var(--ink-soft); }
  .tile .sample { font: 500 0.95rem var(--f-mono); color: var(--ink); border-top: 1px dashed var(--rule-strong); padding-top: 10px; }
  .tile .record { font: 500 0.78rem var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .note { font: 400 0.85rem var(--f-mono); color: var(--ink-soft); }

  /* Ecran de joc */
  .play, .end { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px; padding: 22px; display: grid; gap: 22px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .link { background: none; border: 0; padding: 4px 0; cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  .stats { display: flex; gap: 18px; font: 500 0.85rem var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .stats b { color: var(--ink); font-weight: 500; }
  .ticks { display: flex; gap: 5px; }
  .tick { flex: 1; height: 6px; border-radius: 2px; background: var(--rule-strong); }
  .tick.good { background: var(--good); }
  .tick.bad { background: var(--bad); }
  .tick.now { background: var(--ink); }
  .q { display: grid; gap: 6px; }
  .kicker { font: 500 0.78rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .prompt { font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 6.5vw, 3.2rem); line-height: 1.05; letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .ask { color: var(--ink-soft); font-size: 1.1rem; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .opts.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left; min-height: 3.4rem;
    padding: 0.8rem 1rem; border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--paper); font-weight: 600; font-size: 1.05rem; cursor: pointer; min-width: 0;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .opt .txt { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
  .opt .detail { font: 500 0.85rem var(--f-mono); color: var(--ink-soft); }
  .opt kbd { font: 500 0.75rem var(--f-mono); color: var(--ink-soft); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0.1rem 0.4rem; flex: none; }
  .opt:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.right { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt.dim { opacity: 0.6; }
  .opts.duo .opt { min-height: 5rem; font-size: 1.25rem; font-family: var(--f-display); }
  .feedback { min-height: 3rem; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .fb-text { font-weight: 600; flex: 1 1 16rem; }
  .fb-text.good { color: var(--good); }
  .fb-text.bad { color: var(--bad); }
  .btn {
    border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink);
    padding: 0.75rem 1.3rem; font-weight: 700; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn:hover { filter: brightness(1.08); }

  /* Rezultat */
  .end { justify-items: start; }
  .score { font-family: var(--f-display); font-weight: 700; font-size: clamp(4rem, 16vw, 7rem); line-height: 0.95; font-variant-numeric: tabular-nums; }
  .score small { font-size: 0.35em; color: var(--ink-soft); font-weight: 500; }
  .end .msg { font-size: 1.2rem; max-width: 40ch; }
  .end .rec { font: 500 0.85rem var(--f-mono); color: var(--ink-soft); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }

  /* Clasamente */
  .board-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab { border: 1.5px solid var(--ink); background: var(--paper); border-radius: 6px; padding: 0.45rem 0.9rem; font-weight: 600; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--sea); }
  .board { list-style: none; margin: 0; padding: 0; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--paper); width: 100%; }
  .board li { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 0.55rem 0.9rem; border-top: 1px dashed var(--rule-strong); }
  .board li:first-child { border-top: 0; }
  .board .rk { font: 500 0.85rem var(--f-mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .board .nm { overflow-wrap: anywhere; font-weight: 600; }
  .board .sc { font: 500 0.95rem var(--f-mono); font-variant-numeric: tabular-nums; }
  .board li.me { background: var(--good-bg); }
  .board-msg { font: 400 0.9rem var(--f-mono); color: var(--ink-soft); }
  .submit { display: grid; gap: 8px; width: 100%; max-width: 28rem; }
  .submit label { font: 500 0.78rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .submit .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .submit input { flex: 1 1 10rem; min-width: 0; padding: 0.7rem 0.8rem; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; }
  .btn:disabled { opacity: 0.55; cursor: default; filter: none; }

  @media (max-width: 640px) {
    body { font-size: 16px; padding-block: 20px 36px; }
    .tiles, .opts { grid-template-columns: minmax(0, 1fr); }
    .opts.six { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opts.duo { grid-template-columns: minmax(0, 1fr); }
    .play, .end { padding: 16px; }
    .brand svg { width: 52px; height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .opt { transition: none; }
    .tile:hover, .opt:hover:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" role="img" aria-label="Roza vânturilor" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="32" cy="32" r="28"/>
        <circle cx="32" cy="32" r="21" stroke-dasharray="2 4"/>
        <polygon points="32,6 37,27 58,32 37,37 32,58 27,37 6,32 27,27" fill="currentColor" fill-opacity="0.12"/>
        <polygon points="32,6 37,27 27,27" fill="var(--accent)" stroke="var(--accent)"/>
        <circle cx="32" cy="32" r="2.5" fill="currentColor"/>
      </svg>
      <div>
        <h1>Harta Mută</h1>
        <p class="coords">Jocuri de geografie · 46° N 25° E</p>
      </div>
    </div>
  </header>

  <!-- ECRAN: alegerea jocului -->
  <main id="home" class="wrap" style="gap:22px">
    <p class="lead">Patru jocuri, <strong>zece întrebări</strong> fiecare. Fără cont, fără reclame. Alege unul și vezi cât de bine știi harta.</p>

    <div class="zone">
      <span class="zone-label" id="zone-label">Zonă pentru Capitale</span>
      <div class="seg" role="radiogroup" aria-labelledby="zone-label">
        <input type="radio" name="zone" id="zone-e" value="E" checked>
        <label for="zone-e">Europa</label>
        <input type="radio" name="zone" id="zone-w" value="W">
        <label for="zone-w">Toată lumea</label>
      </div>
    </div>

    <div class="tiles" id="tiles"></div>
    <div><button class="btn ghost" id="show-boards" type="button" hidden>Vezi clasamentele</button></div>
    <p class="note">Suprafețele și populațiile sunt valori aproximative, rotunjite.</p>
  </main>

  <!-- ECRAN: jocul -->
  <section id="play" class="play" hidden aria-live="polite">
    <div class="bar">
      <button class="link" id="back" type="button">← Toate jocurile</button>
      <div class="stats">
        <span>Întrebarea <b id="st-round">1</b>/10</span>
        <span>Scor <b id="st-score">0</b></span>
        <span>Serie <b id="st-streak">0</b></span>
      </div>
    </div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="q">
      <p class="kicker" id="kicker"></p>
      <h2 class="prompt" id="prompt"></h2>
      <p class="ask" id="ask"></p>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback">
      <p class="fb-text" id="fb"></p>
      <button class="btn" id="next" type="button" hidden>Următoarea</button>
    </div>
  </section>

  <!-- ECRAN: clasamente -->
  <section id="boards" class="play" hidden>
    <div class="bar"><button class="link" id="boards-back" type="button">← Toate jocurile</button></div>
    <h2 class="prompt" style="font-size: clamp(1.8rem, 5vw, 2.6rem)">Clasamente</h2>
    <div class="board-tabs" id="board-tabs"></div>
    <ol class="board" id="board-list" hidden></ol>
    <p class="board-msg" id="board-msg"></p>
  </section>

  <!-- ECRAN: rezultat -->
  <section id="end" class="end" hidden>
    <p class="kicker" id="end-game"></p>
    <div class="score"><span id="end-score">0</span><small>/10</small></div>
    <p class="msg" id="end-msg"></p>
    <p class="rec" id="end-rec"></p>
    <div class="submit" id="submit-box" hidden>
      <label for="player-name">Numele tău în clasament</label>
      <div class="row">
        <input id="player-name" maxlength="20" autocomplete="nickname" placeholder="ex. Alex">
        <button class="btn" id="send-score" type="button">Trimite scorul</button>
      </div>
      <p class="board-msg" id="send-msg"></p>
    </div>
    <ol class="board" id="end-board" hidden></ol>
    <div class="actions">
      <button class="btn" id="again" type="button">Încă o rundă</button>
      <button class="btn ghost" id="home-btn" type="button">Alte jocuri</button>
    </div>
  </section>
</div>

      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function fmtArea(thousands) { return Math.round(thousands * 1000).toLocaleString('ro-RO') + ' km²'; }
  function fmtPop(m) { return m.toLocaleString('ro-RO', { maximumFractionDigits: 2 }) + ' mil. locuitori'; }

  // ---------- jocurile ----------
  var zone = store.get('hm-zone') === 'W' ? 'W' : 'E';

  var GAMES = {
    capitale: {
      name: 'Capitale',
      blurb: 'Țara și capitala ei, în ambele sensuri.',
      sample: 'Polonia → ?',
      build: function () {
        var pool = COUNTRIES.filter(function (x) { return x.c && (zone === 'W' || x.k === 'E'); });
        return shuffle(pool).slice(0, ROUNDS).map(function (x) {
          var rev = Math.random() < 0.35;
          var near = shuffle(pool.filter(function (y) { return y !== x && y.k === x.k; }));
          var far = shuffle(pool.filter(function (y) { return y !== x && y.k !== x.k; }));
          var opts = shuffle([x].concat(near.concat(far).slice(0, 3)));
          return rev ? {
            kicker: 'Capitala', prompt: x.c, ask: 'Din ce țară este capitala?',
            options: opts.map(function (o) { return { label: o.n }; }), correct: opts.indexOf(x),
            reveal: x.c + ' este capitala: ' + x.n + '.'
          } : {
            kicker: 'Țara', prompt: x.n, ask: 'Care este capitala?',
            options: opts.map(function (o) { return { label: o.c }; }), correct: opts.indexOf(x),
            reveal: 'Capitala: ' + x.c + '.'
          };
        });
      }
    },
    judete: {
      name: 'Reședințe de județ',
      blurb: 'Cele 40 de județe ale României și orașele lor de reședință.',
      sample: 'Cluj → ?',
      build: function () {
        return shuffle(COUNTIES).slice(0, ROUNDS).map(function (x) {
          var rev = Math.random() < 0.35;
          var opts = shuffle([x].concat(shuffle(COUNTIES.filter(function (y) { return y !== x; })).slice(0, 3)));
          return rev ? {
            kicker: 'Reședința', prompt: x.s, ask: 'Ce județ are această reședință?',
            options: opts.map(function (o) { return { label: o.j }; }), correct: opts.indexOf(x),
            reveal: x.s + ' este reședința județului ' + x.j + '.'
          } : {
            kicker: 'Județul', prompt: x.j, ask: 'Care este reședința de județ?',
            options: opts.map(function (o) { return { label: o.s }; }), correct: opts.indexOf(x),
            reveal: 'Reședința: ' + x.s + '.'
          };
        });
      }
    },
    compara: {
      name: 'Mai mare, mai mic',
      blurb: 'Două țări. Care are suprafața sau populația mai mare?',
      sample: 'Suedia · Germania',
      build: function () {
        var rounds = [], used = {}, guard = 0;
        while (rounds.length < ROUNDS && guard++ < 800) {
          var f = Math.random() < 0.5 ? 'a' : 'p';
          var pool = COUNTRIES.filter(function (x) { return x[f] != null; });
          var two = shuffle(pool).slice(0, 2), x = two[0], y = two[1];
          var hi = Math.max(x[f], y[f]), lo = Math.min(x[f], y[f]);
          if (hi / lo < 1.3) continue;
          var key = [x.n, y.n].sort().join('|') + f;
          if (used[key]) continue;
          used[key] = 1;
          var win = x[f] > y[f] ? 0 : 1;
          var fmt = f === 'a' ? fmtArea : fmtPop;
          rounds.push({
            kicker: f === 'a' ? 'Suprafață' : 'Populație',
            prompt: f === 'a' ? 'Care țară este mai mare?' : 'Care țară are mai mulți locuitori?',
            ask: '',
            layout: 'duo',
            options: [{ label: x.n, detail: fmt(x[f]) }, { label: y.n, detail: fmt(y[f]) }],
            correct: win,
            reveal: (win === 0 ? x.n : y.n) + ' are ' + (f === 'a' ? 'suprafața' : 'populația') + ' mai mare.'
          });
        }
        return rounds;
      }
    },
    continente: {
      name: 'Continente',
      blurb: 'Pune fiecare țară pe continentul ei.',
      sample: 'Peru → ?',
      build: function () {
        var pool = COUNTRIES.filter(function (x) { return !x.amb; });
        return shuffle(pool).slice(0, ROUNDS).map(function (x) {
          return {
            kicker: 'Țara', prompt: x.n, ask: 'În ce continent se află?',
            layout: 'six',
            options: CONT_ORDER.map(function (k) { return { label: CONT[k] }; }),
            correct: CONT_ORDER.indexOf(x.k),
            reveal: x.n + ' se află în ' + CONT[x.k] + '.'
          };
        });
      }
    }
  };
  var GAME_IDS = ['capitale', 'judete', 'compara', 'continente'];

  // ---------- clasamente (Supabase) ----------
  // Completează adresa proiectului și cheia publică (anon / publishable). Cât timp sunt goale, clasamentele rămân ascunse.
  var CONFIG = { url: 'https://apoaelqidmsfadypvfmf.supabase.co', key: 'sb_publishable_7ce0hrSOgMHJMEiVdYomtg_KZ1kofQq' };
  var ENABLED = !!(CONFIG.url && CONFIG.key);
  var BOARDS = [
    ['capitale-europa', 'Capitale · Europa'], ['capitale-lume', 'Capitale · Lume'],
    ['judete', 'Reședințe de județ'], ['compara', 'Mai mare, mai mic'], ['continente', 'Continente']
  ];
  function boardId(id) { return id === 'capitale' ? (zone === 'W' ? 'capitale-lume' : 'capitale-europa') : id; }
  function apiHeaders(extra) {
    var h = { apikey: CONFIG.key, 'Content-Type': 'application/json' };
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  function fetchBoard(board) {
    var q = '/rest/v1/scoruri?joc=eq.' + encodeURIComponent(board) + '&select=nume,scor&order=scor.desc,creat_la.asc&limit=10';
    return fetch(CONFIG.url.replace(/\/$/, '') + q, { headers: apiHeaders() }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }
  function renderRows(list, rows, me) {
    list.textContent = '';
    var marked = false;
    rows.forEach(function (row, i) {
      var li = document.createElement('li');
      var rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i + 1) + '.';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = row.nume;
      var sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = row.scor + '/10';
      if (me && !marked && row.nume === me.nume && row.scor === me.scor) { li.className = 'me'; marked = true; }
      li.appendChild(rk); li.appendChild(nm); li.appendChild(sc);
      list.appendChild(li);
    });
    list.hidden = rows.length === 0;
    return marked;
  }

  var boardToken = 0;
  function selectBoard(id) {
    var token = ++boardToken;
    var tabs = $('board-tabs').children;
    for (var k = 0; k < tabs.length; k++) tabs[k].setAttribute('aria-pressed', String(tabs[k].dataset.id === id));
    var list = $('board-list'), msg = $('board-msg');
    list.hidden = true; msg.textContent = 'Se încarcă…';
    fetchBoard(id).then(function (rows) {
      if (token !== boardToken) return;
      renderRows(list, rows, null);
      msg.textContent = rows.length ? 'Primii 10 jucători.' : 'Încă nu e nimeni în clasament. Fii primul.';
    }).catch(function () {
      if (token !== boardToken) return;
      msg.textContent = 'Nu am putut încărca clasamentul. Încearcă mai târziu.';
    });
  }
  function openBoards() {
    var tabs = $('board-tabs');
    tabs.textContent = '';
    BOARDS.forEach(function (b) {
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'tab'; t.dataset.id = b[0]; t.textContent = b[1];
      t.setAttribute('aria-pressed', 'false');
      t.addEventListener('click', function () { selectBoard(b[0]); });
      tabs.appendChild(t);
    });
    show('boards');
    selectBoard(S ? S.board : boardId('capitale'));
  }

  function setupSubmit() {
    var box = $('submit-box'), list = $('end-board');
    list.hidden = true; list.textContent = '';
    $('send-msg').textContent = '';
    if (!ENABLED || S.score < 1) { box.hidden = true; return; }
    box.hidden = false;
    $('player-name').value = store.get('hm-name') || '';
    $('send-score').disabled = false;
    S.sent = false;
  }
  function sendScore() {
    if (!S || S.sent) return;
    var name = $('player-name').value.replace(/\s+/g, ' ').trim();
    var msg = $('send-msg');
    if (name.length < 2 || name.length > 20) { msg.textContent = 'Scrie un nume între 2 și 20 de caractere.'; return; }
    S.sent = true;
    $('send-score').disabled = true;
    msg.textContent = 'Se trimite…';
    store.set('hm-name', name);
    var board = S.board, score = S.score;
    fetch(CONFIG.url.replace(/\/$/, '') + '/rest/v1/scoruri', {
      method: 'POST',
      headers: apiHeaders({ Prefer: 'return=minimal' }),
      body: JSON.stringify({ joc: board, nume: name, scor: score })
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return fetchBoard(board);
    }).then(function (rows) {
      var found = renderRows($('end-board'), rows, { nume: name, scor: score });
      msg.textContent = found ? 'Scor trimis. Ești în top 10.' : 'Scor trimis. Încă nu ești în primii 10.';
    }).catch(function () {
      S.sent = false;
      $('send-score').disabled = false;
      msg.textContent = 'Nu s-a putut trimite. Încearcă din nou.';
    });
  }

  // ---------- stare ----------
  var S = null;

  function bestKey(id) { return 'hm-best-' + id + (id === 'capitale' ? '-' + zone : ''); }
  function getBest(id) { var v = parseInt(store.get(bestKey(id)), 10); return isNaN(v) ? null : v; }

  function show(which) {
    $('home').hidden = which !== 'home';
    $('play').hidden = which !== 'play';
    $('end').hidden = which !== 'end';
    $('boards').hidden = which !== 'boards';
  }

  function renderHome() {
    var host = $('tiles');
    host.textContent = '';
    GAME_IDS.forEach(function (id) {
      var g = GAMES[id];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tile';
      var best = getBest(id);
      var h = document.createElement('h2'); h.textContent = g.name;
      var p = document.createElement('p'); p.textContent = g.blurb;
      var s = document.createElement('p'); s.className = 'sample'; s.textContent = g.sample;
      var r = document.createElement('p'); r.className = 'record';
      r.textContent = best === null ? 'Încă nejucat' : 'Record: ' + best + '/10';
      b.appendChild(h); b.appendChild(p); b.appendChild(s); b.appendChild(r);
      b.addEventListener('click', function () { start(id); });
      host.appendChild(b);
    });
    $('show-boards').hidden = !ENABLED;
    show('home');
  }

  function start(id) {
    S = { id: id, board: boardId(id), sent: false, rounds: GAMES[id].build(), i: 0, score: 0, streak: 0, results: [], answered: false };
    var t = $('ticks'); t.textContent = '';
    S.rounds.forEach(function () { var d = document.createElement('span'); d.className = 'tick'; t.appendChild(d); });
    show('play');
    renderRound();
  }

  function renderRound() {
    var r = S.rounds[S.i];
    S.answered = false;
    $('st-round').textContent = S.i + 1;
    $('st-score').textContent = S.score;
    $('st-streak').textContent = S.streak;
    var ticks = $('ticks').children;
    for (var k = 0; k < ticks.length; k++) {
      ticks[k].className = 'tick' + (S.results[k] === true ? ' good' : S.results[k] === false ? ' bad' : k === S.i ? ' now' : '');
    }
    $('kicker').textContent = r.kicker;
    $('prompt').textContent = r.prompt;
    $('ask').textContent = r.ask || '';
    $('ask').hidden = !r.ask;
    var host = $('opts');
    host.textContent = '';
    host.className = 'opts' + (r.layout ? ' ' + r.layout : '');
    r.options.forEach(function (o, idx) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      var kb = document.createElement('kbd'); kb.textContent = idx + 1;
      var tx = document.createElement('span'); tx.className = 'txt';
      var l = document.createElement('span'); l.textContent = o.label; tx.appendChild(l);
      if (o.detail) { var d = document.createElement('span'); d.className = 'detail'; d.hidden = true; d.textContent = o.detail; tx.appendChild(d); }
      b.appendChild(kb); b.appendChild(tx);
      b.addEventListener('click', function () { choose(idx); });
      host.appendChild(b);
    });
    var fb = $('fb'); fb.textContent = ''; fb.className = 'fb-text';
    $('next').hidden = true;
  }

  function choose(idx) {
    if (!S || S.answered) return;
    S.answered = true;
    var r = S.rounds[S.i];
    var ok = idx === r.correct;
    S.results[S.i] = ok;
    if (ok) { S.score++; S.streak++; } else { S.streak = 0; }
    var btns = $('opts').children;
    for (var k = 0; k < btns.length; k++) {
      btns[k].disabled = true;
      if (k === r.correct) btns[k].classList.add('right');
      else if (k === idx) btns[k].classList.add('wrong');
      else btns[k].classList.add('dim');
      var d = btns[k].querySelector('.detail'); if (d) d.hidden = false;
    }
    var fb = $('fb');
    fb.className = 'fb-text ' + (ok ? 'good' : 'bad');
    fb.textContent = (ok ? '✓ Corect. ' : '✗ Greșit. ') + r.reveal;
    $('st-score').textContent = S.score;
    $('st-streak').textContent = S.streak;
    var ticks = $('ticks').children;
    ticks[S.i].className = 'tick ' + (ok ? 'good' : 'bad');
    var nx = $('next');
    nx.textContent = S.i === S.rounds.length - 1 ? 'Vezi rezultatul' : 'Următoarea';
    nx.hidden = false;
    nx.focus();
  }

  function next() {
    if (!S || !S.answered) return;
    if (S.i === S.rounds.length - 1) return finish();
    S.i++;
    renderRound();
  }

  function finish() {
    var total = S.rounds.length;
    var prev = getBest(S.id);
    var isNew = prev === null || S.score > prev;
    if (isNew) store.set(bestKey(S.id), String(S.score));
    $('end-game').textContent = GAMES[S.id].name + (S.id === 'capitale' ? ' · ' + (zone === 'W' ? 'Toată lumea' : 'Europa') : '');
    $('end-score').textContent = S.score;
    var msg = S.score >= 9 ? 'Excelent. Harta nu mai are secrete pentru tine.'
      : S.score >= 6 ? 'Bine. Încă o rundă și îți depășești scorul.'
      : 'Se învață repede. Încearcă din nou, întrebările se schimbă.';
    $('end-msg').textContent = msg;
    $('end-rec').textContent = isNew ? 'Record nou: ' + S.score + '/' + total : 'Recordul tău: ' + prev + '/' + total;
    show('end');
    setupSubmit();
    $('again').focus();
  }

  // ---------- evenimente ----------
  $('next').addEventListener('click', next);
  $('back').addEventListener('click', renderHome);
  $('home-btn').addEventListener('click', renderHome);
  $('show-boards').addEventListener('click', openBoards);
  $('boards-back').addEventListener('click', renderHome);
  $('send-score').addEventListener('click', sendScore);
  $('player-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendScore(); });
  $('again').addEventListener('click', function () { start(S.id); });
  document.addEventListener('keydown', function (e) {
    if ($('play').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 6) choose(n - 1);
  });
  document.querySelectorAll('input[name="zone"]').forEach(function (el) {
    el.checked = el.value === zone;
    el.addEventListener('change', function () {
      zone = el.value; store.set('hm-zone', zone); renderHome();
    });
  });

  renderHome();
})();
</script>

</body>
